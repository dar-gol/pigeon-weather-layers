<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pigeon Weather Layers example</title>
    <style>
      .local-server-help {
        box-sizing: border-box;
        max-width: 42rem;
        margin: 4rem auto;
        padding: 1.5rem;
        border: 1px solid #b8c5d1;
        border-radius: 0.75rem;
        color: #17212b;
        font: 16px/1.5 system-ui, sans-serif;
      }

      .local-server-help > code {
        display: block;
        margin-top: 1rem;
        padding: 0.75rem;
        border-radius: 0.35rem;
        background: #eef3f7;
        user-select: all;
      }
    </style>
  </head>
  <body>
    <main id="map" aria-label="Weather map"></main>
    <section id="local-server-help" class="local-server-help" hidden>
      <h1>Start the example through its local server</h1>
      <p>
        Browsers cannot run this TypeScript, fetch weather assets, or start the
        MapLibre worker from a <code>file://</code> page. Run this command from
        the repository root instead:
      </p>
      <code>npm run example:open</code>
    </section>
    <script>
      if (window.location.protocol === "file:") {
        document.querySelector("#map")?.setAttribute("hidden", "");
        document.querySelector("#local-server-help")?.removeAttribute("hidden");
      }
    </script>
    <script type="module">
      if (window.location.protocol !== "file:") {
        const { startExample } = await import("./main.ts");
        await startExample();
      }
    </script>
  </body>
</html>
